# CAST lambda response sweep 0: 5 Pilot-0 prompts x 7 lambda values, alpha 1.5, deterministic, shared seed-42 latent.
checkpoint: auffusion/auffusion
seed: 42
num_inference_steps: 100
guidance_scale: 7.5
height: 256
width: 1024
dtype: float16
autocast: true
device: cuda
apply_to_uncond: true
collect_stats: true
deterministic_self_attn: true
output_dir: outputs/lambda_sweep0
alpha: 1.5
lambdas: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
pilot0_dir: outputs/pilot0
pilot0_modes: {0.0: cast_vanilla, 1.0: cast_sparse, 2.0: cast_pladis}
validation_prompt: P03_TWO_DOG_RAIN
prompts:
  P01_SINGLE_DOG: "A dog barking loudly."
  P02_SINGLE_RAIN: "Heavy rain falling on a roof."
  P03_TWO_DOG_RAIN: "A dog barking while rain falls in the background."
  P04_TWO_SPEECH_HORN: "A man speaking while a car horn sounds nearby."
  P05_TWO_FOOTSTEPS_BIRDS: "Footsteps on a wooden floor while birds chirp outside."
