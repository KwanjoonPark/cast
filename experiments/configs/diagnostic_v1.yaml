# CAST diagnostic v1: 24 frozen prompts x lambda {0, 0.5, 1, 2} x seeds {42, 123, 2026}; alpha 1.5; deterministic self-attn.
checkpoint: auffusion/auffusion
num_inference_steps: 100
guidance_scale: 7.5
height: 256
width: 1024
dtype: float16
autocast: true
device: cuda
